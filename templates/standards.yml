# Venuvra engineering standards. Installed by `vstd init`; don't edit by hand.
# The tool and rules come from the release pinned in .venuvra/standards.toml,
# so upgrades change that file only, never this workflow.
name: standards

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly sync proposal, Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: What the sync should do
        type: choice
        options:
          - diff-only
          - open-pr
        default: diff-only
      runner:
        description: Where to run (default is the STANDARDS_RUNNER variable, else GitHub-hosted)
        type: choice
        options:
          - default
          - venuvra-local
          - venuvra-oci
          - ubuntu-24.04
        default: default

permissions:
  contents: read

concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true

env:
  CENTRAL: Venuvra/engineering-standards-claude

jobs:
  check:
    # Same name as the commit status sync sets, so one required check covers both.
    name: standards/check
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    # STANDARDS_RUNNER (a repository or organization variable) moves the jobs to your own
    # runners, such as venuvra-local; unset, they run on GitHub. Fork PRs always stay on GitHub.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' && 'ubuntu-24.04')
      || (inputs.runner != 'default' && inputs.runner) || vars.STANDARDS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-hosted runner images may lack Python 3.11+, which vstd needs (tomllib).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read and verify the pinned release
        id: pin
        run: |
          python3 -I - <<'EOF'
          import os, re, subprocess, tomllib
          with open(".venuvra/standards.toml", "rb") as f:
              cfg = tomllib.load(f)
          version, commit = str(cfg.get("version", "")), str(cfg.get("commit", ""))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("::error file=.venuvra/standards.toml::version or commit is not valid")
          url = f"https://github.com/{os.environ['CENTRAL']}.git"
          out = subprocess.run(["git", "ls-remote", "--tags", url, f"refs/tags/v{version}", f"refs/tags/v{version}^{{}}"],
                               capture_output=True, text=True, check=True, timeout=60).stdout.split()
          refs = dict(zip(out[1::2], out[0::2]))
          tagged = refs.get(f"refs/tags/v{version}^{{}}") or refs.get(f"refs/tags/v{version}")
          if tagged != commit:
              raise SystemExit(f"::error file=.venuvra/standards.toml::v{version} is {tagged}, not the pinned commit {commit}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"commit={commit}\n")
          EOF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CENTRAL }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .vstd
          persist-credentials: false
      - name: vstd check
        run: python3 -I .vstd/vstd/main.py check --repo .

  sync:
    # Also on pushes, but it only syncs when the push changed the standards config:
    # that runs it once right after the onboarding PR merges, with no one pressing Run.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
      && github.repository_owner == 'Venuvra'
    # Same runner choice as the check job.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' && 'ubuntu-24.04')
      || (inputs.runner != 'default' && inputs.runner) || vars.STANDARDS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write # push the standards/update branch in THIS repo only
      pull-requests: write # open or update the PR
      statuses: write # report standards/check on the PR head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Self-hosted runner images may lack Python 3.11+, which vstd needs (tomllib).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Decide whether to sync
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ] || git diff --name-only HEAD^ HEAD -- .venuvra/standards.toml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Push did not change .venuvra/standards.toml; nothing to sync."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read and verify the pinned release
        if: steps.gate.outputs.run == 'true'
        id: pin
        run: |
          python3 -I - <<'EOF'
          import os, re, subprocess, tomllib
          with open(".venuvra/standards.toml", "rb") as f:
              cfg = tomllib.load(f)
          version, commit = str(cfg.get("version", "")), str(cfg.get("commit", ""))
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("::error file=.venuvra/standards.toml::version or commit is not valid")
          url = f"https://github.com/{os.environ['CENTRAL']}.git"
          out = subprocess.run(["git", "ls-remote", "--tags", url, f"refs/tags/v{version}", f"refs/tags/v{version}^{{}}"],
                               capture_output=True, text=True, check=True, timeout=60).stdout.split()
          refs = dict(zip(out[1::2], out[0::2]))
          tagged = refs.get(f"refs/tags/v{version}^{{}}") or refs.get(f"refs/tags/v{version}")
          if tagged != commit:
              raise SystemExit(f"::error file=.venuvra/standards.toml::v{version} is {tagged}, not the pinned commit {commit}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"commit={commit}\n")
          EOF
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CENTRAL }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .vstd
          persist-credentials: false
      - name: vstd sync
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'open-pr' }}
        run: |
          set -- sync --repo .
          if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi
          python3 -I .vstd/vstd/main.py "$@"
